<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12234a"/>
      <stop offset="1" stop-color="#070d1c"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bae6fd" stop-opacity=".75"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity=".12"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- view cone from the lens down to the water -->
  <path d="M256 104 L150 318 L362 318 Z" fill="url(#cone)"/>
  <!-- lens -->
  <circle cx="256" cy="104" r="38" fill="#070d1c" stroke="#bae6fd" stroke-width="12"/>
  <circle cx="256" cy="104" r="13" fill="#38bdf8"/>
  <!-- flood water -->
  <path d="M56 318 C104 290 152 290 200 318 S296 346 344 318 S424 290 456 312 L456 400 L56 400 Z" fill="url(#water)"/>
  <path d="M56 372 C104 346 152 346 200 372 S296 398 344 372 S424 346 456 366" fill="none" stroke="#7dd3fc" stroke-width="12" stroke-linecap="round" opacity=".8"/>
  <path d="M56 318 C104 290 152 290 200 318 S296 346 344 318 S424 290 456 312" fill="none" stroke="#e0f2fe" stroke-width="12" stroke-linecap="round"/>
  <!-- crosshair point on the waterline -->
  <circle cx="256" cy="330" r="22" fill="none" stroke="#f472b6" stroke-width="10"/>
  <circle cx="256" cy="330" r="7" fill="#f472b6"/>
</svg>
